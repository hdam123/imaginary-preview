<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Portfolio — Imaginary</title>
  <link rel="stylesheet" href="css/styles.css?v=v2-12">
  <link rel="stylesheet" href="css/version-toggle.css?v=v2-13">
</head>
<body>

  <!-- Compact bar: slides in when scrolling back up -->
  <header class="nav frost" aria-label="Site">
    <a class="wordmark" href="index.html" aria-label="Imaginary home"><img src="assets/img/wordmark.png" alt="" width="1801" height="174"></a>
    <button class="nav__menu" type="button" data-menu-open aria-expanded="false" aria-label="Open menu"><img src="assets/icons/menu-white.svg" alt="" width="27.4809" height="27.4809"></button>
  </header>

  <!-- Menu (Figma 3273:385): frosted bar, links right-aligned -->
  <div class="menu" aria-hidden="true">
    <div class="menu__catch"></div>
    <nav class="menu__panel frost" aria-label="Main">
      <a class="wordmark" href="index.html" aria-label="Imaginary home"><img src="assets/img/wordmark.png" alt="" width="1801" height="174"></a>
      <button class="menu__close" type="button" aria-label="Close menu"><img src="assets/icons/close-v2.svg" alt="" width="24" height="24"></button>
      <ul class="menu__links">
        <li><a href="team.html">Team</a></li>
        <li><a href="portfolio.html" aria-current="page">Portfolio</a></li>
        <li><a href="index.html#contact">Investor</a></li>
      </ul>
    </nav>
  </div>

  <main class="page">

    <!-- Intro (Figma 3273:644) -->
    <section class="intro p-intro">
      <a class="wordmark intro__wordmark" href="index.html" aria-label="Imaginary home"><img src="assets/img/wordmark.png" alt="" width="1801" height="174"></a>
      <button class="menu-trigger" type="button" data-menu-open aria-expanded="false" aria-label="Open menu">
        <img src="assets/icons/menu-portfolio.svg" alt="" width="27.4809" height="27.4809">
      </button>
      <h1 class="intro__text" data-reveal style="--d:.2s">We invest across stages and industries, partnering with companies that resonate in modern consumer culture and create desire uniquely.</h1>
    </section>

    <!-- Featured companies (Figma 3273:651) -->
    <section class="p-featured" aria-label="Featured companies">
      <div class="feature" data-inview>
        <div class="feature__media" style="left:-3.7rem;top:-4.6rem;width:52.3rem;height:29.3rem"><img src="assets/featured/skims.jpg" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label" style="left:18.8rem">Skims</p>
      </div>
      <div class="feature" data-inview>
        <div class="feature__media" style="left:-3.5rem;top:-1.2rem;width:51.9rem;height:23.4rem"><img src="assets/featured/westman.jpg" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label" style="left:11.4rem">Westman Atelier</p>
      </div>
      <div class="feature" data-inview>
        <div class="feature__media" style="left:0rem;top:-10.853rem;width:64.7444rem;height:36.4187rem"><img src="assets/featured/glossgenius.jpg" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label" style="left:13.7rem">GLOSS GENIUS</p>
      </div>
      <div class="feature feature--red" data-inview>
        <div class="feature__media" style="left:0rem;top:-1.2423rem;width:45rem;height:30.0366rem"><img src="assets/featured/bero.jpg" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label feature__label--center">BERO</p>
      </div>
      <div class="feature feature--red" data-inview>
        <div class="feature__media" style="left:0rem;top:0rem;width:45rem;height:20.1168rem"><img class="crop" src="assets/featured/david.png" alt="" loading="lazy" decoding="async" style="left:-141.68%;top:-123.27%;width:241.68%;height:304.1%"></div>
        <p class="feature__label feature__label--center">DAVID</p>
      </div>
      <div class="feature feature--red" data-inview>
        <div class="feature__media" style="left:0rem;top:-22.55rem;width:45rem;height:67.5rem"><img src="assets/featured/reale.jpg" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label feature__label--center" style="left:0.1rem">REALE ACTIVES</p>
      </div>
      <div class="feature" data-inview>
        <div class="feature__media" style="left:0rem;top:-5.17rem;width:45rem;height:25.1695rem"><img src="assets/featured/nordic.jpg" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label" style="left:13.5rem">NORDIC KNOTS</p>
      </div>
      <div class="feature feature--deep" data-inview>
        <div class="feature__media" style="left:0.1rem;top:-9.8289rem;width:44.9rem;height:42.0577rem"><img src="assets/featured/sundays.png" alt="" loading="lazy" decoding="async"></div>
        <p class="feature__label" style="left:16.9rem">Sundays</p>
      </div>
    </section>

    <!-- All companies: Category / Status dropdowns + grid (Figma 3273:677, 3273:1017) -->
    <section class="p-list" aria-label="All portfolio companies">
      <div class="p-filters">
        <button class="p-toggle" type="button" aria-expanded="false" aria-controls="panel-category" data-panel="category">Category <img class="p-toggle__chev" src="assets/icons/chevron.svg" alt="" width="24" height="24"></button>
        <button class="p-toggle" type="button" aria-expanded="false" aria-controls="panel-status" data-panel="status">Status <img class="p-toggle__chev" src="assets/icons/chevron.svg" alt="" width="24" height="24"></button>
      </div>
      <div class="p-panel" id="panel-category"><div class="p-panel__clip"><div class="p-chips" role="group" aria-label="Filter by category"></div></div></div>
      <div class="p-panel" id="panel-status"><div class="p-panel__clip"><div class="p-chips" role="group" aria-label="Filter by status"></div></div></div>
      <div class="p-grid"></div>
    </section>

    <!-- Footer (Figma 3273:518) -->
    <footer class="footer" id="contact">
      <img class="footer__bg" data-parallax="0.15" data-anchor="bottom" src="assets/img/footer-clouds.jpg" alt="" width="1694.656" height="1694.656" loading="lazy" decoding="async">
      <nav class="footer__links" aria-label="Social">
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LINKEDIN</a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener">INSTAGRAM</a>
      </nav>
    </footer>
  </main>

  <script src="js/main.js?v=v2-12"></script>
  <script src="js/portfolio.js?v=v2-14"></script>
  <script src="js/version-toggle.js?v=v2-13"></script>
</body>
</html>
